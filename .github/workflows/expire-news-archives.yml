name: Review old news archives (safe mode)

on:
  schedule:
    - cron: "20 18 1 4 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-old-archives:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review archive retention plan without moving files
        shell: bash
        run: |
          set -euo pipefail
          current_year=$(date -u +%Y)
          current_month=$(date -u +%m)
          if [ "$current_month" -lt 4 ]; then
            fiscal_year=$((current_year - 1))
          else
            fiscal_year=$current_year
          fi
          oldest_kept=$((fiscal_year - 9))
          protected_label="削除保護（${oldest_kept}年度より前の記事）"
          protected_dir="news/${protected_label}"

          echo "=== SAFE MODE: review only ==="
          echo "Fiscal year: ${fiscal_year}"
          echo "Keep active archive folders from: ${oldest_kept}"
          echo "Move rule: protect years strictly less than ${oldest_kept}; retain ${oldest_kept} and later."
          echo "Proposed protected folder: ${protected_dir}"
          echo "This workflow has read-only permissions and will not move or delete files."

          for dir in news/[0-9][0-9][0-9][0-9]; do
            [ -d "$dir" ] || continue
            year="${dir#news/}"
            if [ "$year" -lt "$oldest_kept" ]; then
              destination="${protected_dir}/${year}"
              echo "REVIEW: ${dir} would need protection."
              if [ -e "$destination" ]; then
                echo "CONFLICT: destination already exists: ${destination}"
              else
                echo "PROPOSED DESTINATION: ${destination}"
              fi
            else
              echo "KEEP: ${dir}"
            fi
          done

          for old_dir in news/削除保護*; do
            [ -d "$old_dir" ] || continue
            echo "EXISTING PROTECTED FOLDER: ${old_dir}"
          done

          echo "No files changed. URL and relative-link preservation must be designed before any move is considered."
