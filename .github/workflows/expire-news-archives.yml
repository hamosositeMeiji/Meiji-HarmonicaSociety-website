name: Review and protect old news archives

on:
  schedule:
    - cron: "20 18 1 4 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect-old-archives:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move expired archives into protected storage and refresh its name
        shell: bash
        run: |
          set -euo pipefail
          current_year=$(date -u +%Y)
          current_month=$(date -u +%m)
          if [ "$current_month" -lt 4 ]; then fiscal_year=$((current_year - 1)); else fiscal_year=$current_year; fi
          oldest_kept=$((fiscal_year - 9))
          protected_label="削除保護（${oldest_kept}年度以前の記事）"
          protected_dir="news/${protected_label}"
          echo "Fiscal year: $fiscal_year; keep active archives from $oldest_kept onward"
          mkdir -p "$protected_dir"
          changed=1
          for dir in news/[0-9][0-9][0-9][0-9]; do
            [ -d "$dir" ] || continue
            year="${dir#news/}"
            if [ "$year" -lt "$oldest_kept" ]; then
              destination="$protected_dir/$year"
              mkdir -p "$destination"
              echo "Protecting $dir -> $destination"
              cp -a "$dir"/. "$destination"/
              rm -rf -- "$dir"
            fi
          done
          for old_dir in news/削除保護*; do
            [ -d "$old_dir" ] || continue
            [ "$old_dir" = "$protected_dir" ] && continue
            cp -a "$old_dir"/. "$protected_dir"/
            rm -rf -- "$old_dir"
          done
          cat > "$protected_dir/README.md" <<EOF
# ${protected_label}

このフォルダは通常の10年度保存期間を超えた記事を自動削除せず保護する場所です。

- 基準年度：${fiscal_year}年度
- 保護対象：${oldest_kept}年度以前
- 通常のアーカイブ保持対象：${oldest_kept}〜${fiscal_year}年度
- GitHub Actionsが毎年4月に保存境界を再計算し、古くなった年度フォルダをここへ移動します。
- このフォルダ内の年度別サブフォルダは、自動削除処理の対象外です。

注意：移動で相対リンクや画像パスが変わる場合があります。公開リポジトリのため、個人情報や公開許諾のない写真は保存しないでください。
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A news
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "Protect expired news archives and refresh retention boundary"
          git push
