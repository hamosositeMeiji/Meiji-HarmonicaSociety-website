name: Expire old news archives

on:
  schedule:
    # Run every April 1 at 03:20 JST (18:20 UTC on March 31).
    - cron: "20 18 31 3 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire-archives:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove archives older than ten fiscal years
        shell: bash
        run: |
          set -euo pipefail
          current_year=$(date -u +%Y)
          current_month=$(date -u +%m)
          if [ "$current_month" -lt 4 ]; then
            fiscal_year=$((current_year - 1))
          else
            fiscal_year=$current_year
          fi
          oldest_kept=$((fiscal_year - 9))
          echo "Current fiscal year: $fiscal_year"
          echo "Oldest fiscal year to keep: $oldest_kept"
          changed=0
          for dir in news/[0-9][0-9][0-9][0-9]; do
            [ -d "$dir" ] || continue
            year="${dir#news/}"
            if [ "$year" -lt "$oldest_kept" ]; then
              echo "Removing expired archive: $dir"
              git rm -r -- "$dir"
              changed=1
            fi
          done
          if [ "$changed" -eq 0 ]; then
            echo "No expired archives to remove."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Expire news archives older than ten fiscal years"
          git push