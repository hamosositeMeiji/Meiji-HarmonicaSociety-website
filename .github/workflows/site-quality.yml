name: Site quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly on Mondays at 00:00 UTC (09:00 JST); static checks only.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-audit:
    name: site-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run site quality audit
        run: |
          node scripts/site-audit.mjs
          node scripts/news-integration-test.mjs
          node scripts/media-library-test.mjs
          node scripts/worker-api-contract-test.mjs
