<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>バックアップ・復元｜ハモソ管理画面</title><style>
:root{color-scheme:light;--paper:#f8f8f3;--ink:#20231c;--muted:#697064;--accent:#8b9f40;--line:#dfe2d7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans JP",sans-serif;line-height:1.75}.shell{width:min(100% - 32px,820px);margin:auto}header,footer{padding:20px 0;border-bottom:1px solid var(--line)}footer{border-top:1px solid var(--line);border-bottom:0;color:var(--muted);font-size:13px}a{color:inherit}.panel{margin:28px 0;padding:24px;border:1px solid var(--line);border-radius:18px;background:#fff}.panel h2{margin-top:0}.hint{color:var(--muted);font-size:14px}.btn{display:inline-block;margin:8px 8px 8px 0;padding:11px 16px;border:1px solid #9da98a;border-radius:10px;background:#fff;color:#263322;font-weight:700;cursor:pointer}.btn.primary{background:#34452b;color:#fff;border-color:#34452b}.btn:disabled{opacity:.55;cursor:wait}.status{display:block;min-height:1.6em;margin-top:12px;font-size:14px}.warning{padding:12px;border-left:4px solid #b58a36;background:#faf5e8;font-size:14px}.field{margin:18px 0}.field input{max-width:100%}
</style></head><body><header><div class="shell"><a href="./index.html">← 管理画面トップへ戻る</a><h1>データのバックアップ・復元</h1><p class="hint">サイト情報・お知らせ・アップロード画像を1つのJSONファイルに保存します。</p></div></header>
<main class="shell"><section class="panel"><h2>バックアップを作成</h2><p>現在のサイト情報、お知らせ、KVに保存された画像を読み出し、JSONファイルとしてダウンロードします。画像が多い場合は時間がかかります。</p><button class="btn primary" id="export">バックアップをダウンロード</button><span class="status" id="export-status" role="status" aria-live="polite"></span></section>
<section class="panel"><h2>バックアップから復元</h2><p class="warning">復元すると、現在のサイト情報とお知らせはバックアップの内容に置き換わります。操作前に、念のため現在の状態もバックアップしてください。画像は追加・上書きされますが、バックアップに含まれない画像は削除しません。</p><div class="field"><label for="backup-file">バックアップJSONファイル</label><br><input id="backup-file" type="file" accept=".json,application/json"></div><button class="btn primary" id="restore">選択したバックアップを復元</button><span class="status" id="restore-status" role="status" aria-live="polite"></span></section></main>
<footer><div class="shell">明治大学ハーモニカソサエティー（ハモソ）｜運営メンバー専用</div></footer>
<script>
(()=>{const API="https://hamoso-admin-auth.hamososaitoguanli.workers.dev",KEY="hamoso_admin_token",$=id=>document.getElementById(id);async function api(path,options={}){const token=sessionStorage.getItem(KEY);if(!token){location.replace("./login.html");throw Error("ログインしてください")}const response=await fetch(API+path,{...options,headers:{"Authorization":"Bearer "+token,...(options.headers||{})}});let data={};try{data=await response.json()}catch{}if(response.status===401){sessionStorage.removeItem(KEY);location.replace("./login.html");throw Error("認証期限が切れました")}if(!response.ok)throw Error((data.error||"通信エラー")+" (HTTP "+response.status+")");return data}
$("export").addEventListener("click",async()=>{const button=$("export");button.disabled=true;let media=[],cursor=null;try{$("export-status").textContent="サイト情報・お知らせを取得中…";const base=await api("/api/backup/export");let complete=false;while(!complete){const path="/api/backup/export-media"+(cursor?"?cursor="+encodeURIComponent(cursor):"");const batch=await api(path);media.push(...batch.items);cursor=batch.cursor;complete=batch.complete;$("export-status").textContent="画像を取得中… "+media.length+"件"}const backup={format:base.format,version:base.version,createdAt:base.createdAt,revisions:base.revisions,siteContent:base.siteContent,announcements:base.announcements,media};const blob=new Blob([JSON.stringify(backup)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="hamoso-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);$("export-status").textContent="バックアップを作成しました（画像 "+media.length+"件）"}catch(e){$("export-status").textContent="バックアップ失敗："+e.message}finally{button.disabled=false}});
$("restore").addEventListener("click",async()=>{const file=$("backup-file").files[0];if(!file){$("restore-status").textContent="先にバックアップJSONを選択してください";return}if(file.size>250*1024*1024){$("restore-status").textContent="ファイルが大きすぎます（250MB以下のバックアップを選択してください）";return}const button=$("restore");button.disabled=true;try{const backup=JSON.parse(await file.text());if(backup.format!=="hamoso-kv-backup"||backup.version!==1||!backup.siteContent||typeof backup.siteContent!=="object"||!Array.isArray(backup.announcements)||!Array.isArray(backup.media))throw Error("対応していないバックアップ形式です");if(!confirm("現在のサイト情報とお知らせをバックアップ内容に置き換えます。先に現在の状態をバックアップしましたか？"))return;let restored=0;for(let i=0;i<backup.media.length;i+=5){const items=backup.media.slice(i,i+5);await api("/api/backup/restore-media",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items})});restored+=items.length;$("restore-status").textContent="画像を復元中… "+restored+"/"+backup.media.length+"件"}await api("/api/backup/restore-content",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({siteContent:backup.siteContent,announcements:backup.announcements})});$("restore-status").textContent="復元しました。画像 "+restored+"件、サイト情報・お知らせを復元しました。管理画面を再読み込みしてください"}catch(e){$("restore-status").textContent="復元失敗："+e.message+"。画像の一部が追加済みの場合があります。サイト情報・お知らせは最後に反映するため、未完了なら従来データを維持します"}finally{button.disabled=false}});
if(!sessionStorage.getItem(KEY)){location.replace("./login.html");return}api("/api/session").catch(()=>{});
})();
</script></body></html>
