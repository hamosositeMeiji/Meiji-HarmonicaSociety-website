<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f8f8f3"><title>画像ライブラリ｜ハモソ管理画面</title>
<style>
:root{color-scheme:light;--paper:#f8f8f3;--ink:#20231c;--muted:#697064;--accent:#8b9f40;--line:#dfe2d7;--danger:#a33b32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.7}button{font:inherit;cursor:pointer}a{color:inherit}.shell{width:min(1040px,calc(100% - 32px));margin:auto}header{border-bottom:1px solid var(--line);background:#fff}.top{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.back{font-weight:700;text-decoration:none;font-size:14px}.eyebrow{font-size:11px;letter-spacing:.14em;color:#687a3d;font-weight:800}h1{font-size:clamp(28px,5vw,38px);line-height:1.25;margin:8px 0}.intro{color:var(--muted);font-size:14px;margin:0 0 22px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:22px 0}.notice{padding:13px 15px;border-left:4px solid #9ba96d;background:#f3f5eb;font-size:13px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;font-weight:700;font-size:13px}.btn.primary{background:#34452b;color:#fff;border-color:#34452b}.btn.danger{color:var(--danger);border-color:#d9aaa5}.btn:disabled{opacity:.45;cursor:not-allowed}.status{font-size:13px;color:var(--muted);min-height:1.5em}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:18px}.asset{border:1px solid var(--line);border-radius:13px;overflow:hidden;min-width:0}.thumb{height:155px;background:#f0f0e9;display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:contain}.assetbody{padding:13px}.asset h2{font-size:13px;overflow-wrap:anywhere;margin:0 0 6px}.meta{font-size:12px;color:var(--muted);margin:3px 0}.usage{font-size:12px;margin:9px 0;overflow-wrap:anywhere}.usage strong{display:block}.empty{padding:30px;text-align:center;color:var(--muted)}.pager{display:flex;gap:10px;justify-content:center;margin:18px 0}footer{padding:22px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}@media(max-width:600px){.shell{width:calc(100% - 24px)}.panel{padding:15px}.top{min-height:60px}.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}.thumb{height:125px}.assetbody{padding:10px}}
</style></head><body>
<header><div class="shell top"><strong>HAMO-SO / ADMIN</strong><a class="back" href="./index.html">← ダッシュボード</a></div></header>
<main class="shell"><div style="padding:30px 0 8px"><div class="eyebrow">MEDIA MANAGEMENT</div><h1>保存画像ライブラリ</h1><p class="intro">管理用ストレージに保存された画像を一覧で確認できます。</p></div>
<section class="panel"><div class="notice"><strong>削除の安全ルール</strong><br>掲載先が表示されている画像は、この画面から削除できません。先に写真・活動紹介またはお知らせの編集画面で画像を外して保存し、一覧を更新してください。未使用と確認できた画像だけを削除できます。</div>
<div class="toolbar" style="margin-top:16px"><div><strong id="summary">読み込み中…</strong><div class="status" id="status" role="status" aria-live="polite"></div></div><button class="btn primary" id="reload" type="button">一覧を更新</button></div>
<div id="assets" class="grid"><div class="empty">画像一覧を読み込んでいます…</div></div><div class="pager"><button class="btn" id="more" type="button" hidden>次の40件を読み込む</button></div>
</section></main><footer><div class="shell">明治大学ハーモニカソサエティー（ハモソ）｜運営メンバー専用</div></footer>
<script>
(()=>{const API="https://hamoso-admin-auth.hamososaitoguanli.workers.dev",KEY="hamoso_admin_token";const $=id=>document.getElementById(id);let cursor=null,loading=false,total=0;const token=sessionStorage.getItem(KEY);if(!token){location.replace("./login.html");return;}
async function api(path,options={}){const response=await fetch(API+path,{...options,headers:{"Authorization":"Bearer "+token,...(options.headers||{})}});let data={};try{data=await response.json()}catch{}if(response.status===401){sessionStorage.removeItem(KEY);location.replace("./login.html");throw Error("認証期限が切れました");}if(!response.ok){const error=Error(data.error||"通信エラー");error.data=data;throw error;}return data;}
function bytes(value){if(value<1024)return value+" B";if(value<1024*1024)return (value/1024).toFixed(1)+" KB";return (value/1024/1024).toFixed(2)+" MB";}
function card(item){const article=document.createElement("article");article.className="asset";const thumb=document.createElement("div");thumb.className="thumb";const img=document.createElement("img");img.loading="lazy";img.alt="保存画像のプレビュー";img.src=item.url;thumb.append(img);const body=document.createElement("div");body.className="assetbody";const heading=document.createElement("h2");heading.textContent=item.id;const type=document.createElement("p");type.className="meta";type.textContent=item.type+" · "+bytes(item.sizeBytes);const usage=document.createElement("div");usage.className="usage";const strong=document.createElement("strong");strong.textContent=item.usageCount?"掲載先："+item.usageCount+"件":"掲載先：なし（未使用）";usage.append(strong);if(item.usageCount){item.usage.slice(0,5).forEach(label=>{const line=document.createElement("div");line.textContent="・"+label;usage.append(line)});if(item.usage.length>5){const more=document.createElement("div");more.textContent="ほか "+(item.usage.length-5)+"件";usage.append(more)}}else{const line=document.createElement("div");line.textContent="現在の管理データから参照されていません";usage.append(line)}const del=document.createElement("button");del.type="button";del.className="btn danger";del.textContent="未使用画像を削除";del.disabled=item.usageCount>0||!item.valid;del.title=item.usageCount?"先に掲載先から画像を外して保存してください":"";del.addEventListener("click",async()=>{if(del.disabled||!confirm("この未使用画像を完全に削除します。元に戻せません。削除しますか？"))return;del.disabled=true;try{await api("/api/media/delete-unused",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:item.id})});article.remove();total=Math.max(0,total-1);$("summary").textContent="読み込み済み "+total+"件";$("status").textContent="画像を削除しました。";}catch(e){del.disabled=false;if(e.data&&e.data.references){$("status").textContent="削除を中止しました。掲載先が見つかりました："+e.data.references.join("、");}else{$("status").textContent="削除失敗："+e.message;}}});body.append(heading,type,usage,del);article.append(thumb,body);return article;}
async function load(reset){if(loading)return;loading=true;$("reload").disabled=true;$("more").disabled=true;if(reset){cursor=null;total=0;$("assets").replaceChildren();$("summary").textContent="読み込み中…";}try{const path="/api/media/library"+(cursor?"?cursor="+encodeURIComponent(cursor):"");const result=await api(path);result.items.forEach(item=>$("assets").append(card(item)));total+=result.items.length;cursor=result.cursor;$("more").hidden=!cursor;$("summary").textContent="読み込み済み "+total+"件";$("status").textContent=result.items.length?"画像 "+result.items.length+"件を読み込みました":"保存画像はありません";if(!$("assets").children.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="保存画像はありません";$("assets").append(empty);}}catch(e){$("status").textContent="読み込み失敗："+e.message;if(!$("assets").children.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="画像一覧を取得できませんでした。Workerのデプロイ状態を確認してください。";$("assets").append(empty);}}finally{loading=false;$("reload").disabled=false;$("more").disabled=false;}}
$("reload").addEventListener("click",()=>load(true));$("more").addEventListener("click",()=>load(false));api("/api/session").catch(()=>{});load(true);
})();
</script></body></html>
