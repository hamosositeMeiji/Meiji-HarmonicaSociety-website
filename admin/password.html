<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#faf9f5"><title>パスワード変更｜ハモソ管理画面</title>
<style>
:root{color-scheme:light;--paper:#faf9f5;--ink:#242820;--muted:#73776d;--line:#e5e3d9;--green:#65783d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.75}.shell{width:min(620px,calc(100% - 28px));margin:auto}header{border-bottom:1px solid var(--line);padding:18px 0}a{color:inherit;text-decoration:none;font-size:13px;font-weight:700}main{padding:38px 0 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:clamp(18px,5vw,28px)}.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:800;color:var(--green)}h1{font-size:clamp(26px,5vw,36px);line-height:1.3;margin:8px 0 10px}.intro,.hint{color:var(--muted);font-size:13px}.field{display:grid;gap:6px;margin:18px 0}.field label{font-size:13px;font-weight:800}.field input{width:100%;padding:12px;border:1px solid #d8d8ce;border-radius:10px;font:inherit}.btn{width:100%;padding:13px;border:0;border-radius:99px;background:var(--ink);color:#fff;font:inherit;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.status{min-height:1.6em;font-size:13px;color:var(--muted);margin-top:12px}.status.error{color:#a12b24}.status.success{color:#49632c}.notice{padding:12px 14px;background:#f2f5e9;border-radius:10px;font-size:12px;margin:18px 0}footer{padding:18px 0;color:var(--muted);font-size:11px}
</style></head><body><header><div class="shell"><a href="./index.html">← 管理画面トップへ戻る</a></div></header><main class="shell"><section class="panel"><div class="eyebrow">ACCOUNT SETTINGS</div><h1>管理者パスワード変更</h1><p class="intro">年度交代時などに、管理画面から新しいパスワードへ変更できます。</p><div class="notice">新しいパスワードは12文字以上にしてください。変更すると、ログイン中のすべての端末がログアウトされます。次回から新しいパスワードでログインしてください。</div><form id="password-form"><div class="field"><label for="current">現在のパスワード</label><input id="current" type="password" autocomplete="current-password" required maxlength="1024"></div><div class="field"><label for="next">新しいパスワード（12文字以上）</label><input id="next" type="password" autocomplete="new-password" minlength="12" required maxlength="1024"></div><div class="field"><label for="confirm">新しいパスワード（確認）</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required maxlength="1024"></div><button class="btn" id="submit" type="submit">パスワードを変更する</button><p class="status" id="status" role="status" aria-live="polite"></p></form></section></main><footer><div class="shell">明治大学ハーモニカソサエティー（ハモソ）｜運営メンバー専用</div></footer>
<script>
(()=>{const API="https://hamoso-admin-auth.hamososaitoguanli.workers.dev",KEY="hamoso_admin_token",$=id=>document.getElementById(id),form=$("password-form"),button=$("submit"),status=$("status");if(!sessionStorage.getItem(KEY)){location.replace("./login.html");return}form.addEventListener("submit",async event=>{event.preventDefault();status.className="status";status.textContent="";const current=$("current").value,next=$("next").value,confirm=$("confirm").value;if(next.length<12){status.textContent="新しいパスワードは12文字以上にしてください";return}if(next!==confirm){status.textContent="新しいパスワードが一致しません";return}if(current===next){status.textContent="現在と異なるパスワードを設定してください";return}button.disabled=true;button.textContent="変更中…";try{const response=await fetch(API+"/api/password/change",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+sessionStorage.getItem(KEY)},body:JSON.stringify({currentPassword:current,newPassword:next,confirmPassword:confirm})});let data={};try{data=await response.json()}catch{}if(response.status===401&&data.error==="current_password_incorrect")throw Error("現在のパスワードが正しくありません");if(response.status===401||response.status===403)throw Error("ログイン期限が切れました。ログインし直してください");if(!response.ok)throw Error(data.error==="invalid_password_fields"?"入力内容を確認してください":"変更できませんでした（HTTP "+response.status+"）");sessionStorage.removeItem(KEY);status.className="status success";status.textContent="変更しました。新しいパスワードでログインしてください。";button.textContent="ログイン画面へ";button.disabled=false;button.onclick=()=>location.replace("./login.html");form.querySelectorAll("input").forEach(input=>input.disabled=true)}catch(error){status.className="status error";status.textContent=error.message;button.disabled=false;button.textContent="パスワードを変更する"}})})();
</script></body></html>
