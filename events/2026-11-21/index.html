  <style>
    :root{--paper:#faf9f5;--ink:#242820;--muted:#73776d;--green:#a6b86a;--line:#e5e3d9;--max:820px}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans","Noto Sans JP",sans-serif;line-height:1.9}
    a{color:inherit;text-decoration:none}.wrap{width:min(var(--max),calc(100% - 40px));margin:auto}
    header{padding:22px 0;border-bottom:1px solid var(--line)}.nav{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800;letter-spacing:.04em}.back{font-size:13px;color:var(--muted)}
    main{padding:76px 0 100px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted)}h1{font-size:clamp(38px,7vw,68px);line-height:1.18;letter-spacing:-.06em;margin:18px 0 16px}.lead{color:var(--muted);margin:0 0 38px}
    .event{padding:clamp(22px,5vw,42px);background:#fff;border:1px solid var(--line);border-radius:22px}.event-label{font-size:11px;letter-spacing:.14em;font-weight:800;color:#65783d}.date{font-size:clamp(24px,4vw,34px);font-weight:800;line-height:1.4;margin:8px 0 30px}.details{display:grid;grid-template-columns:140px 1fr;border-top:1px solid var(--line)}.details dt,.details dd{margin:0;padding:18px 0;border-bottom:1px solid var(--line)}.details dt{font-size:13px;color:var(--muted)}.details dd{font-weight:600}.songs{font-weight:500!important}.songs p{margin:0 0 6px}.songs p:last-child{margin-bottom:0}.closing{text-align:center;font-size:clamp(20px,4vw,28px);font-weight:800;letter-spacing:.02em;margin:36px 0 0}.cta{display:inline-flex;margin-top:30px;padding:12px 20px;background:var(--ink);color:#fff;border-radius:999px;font-size:13px;font-weight:700}.back:focus-visible,.cta:focus-visible{outline:3px solid var(--green);outline-offset:4px}
    @media(max-width:600px){main{padding:52px 0 70px}.details{grid-template-columns:1fr}.details dt{padding:14px 0 0;border-bottom:0}.details dd{padding:4px 0 16px}.lead{font-size:14px}}
  </style>
