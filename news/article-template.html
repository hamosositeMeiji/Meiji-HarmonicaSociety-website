  <style>
    :root {
      --paper: #f8f8f3;
      --ink: #20231c;
      --muted: #73766c;
      --accent: #8b9f40;
      --line: #dedfd4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans JP", sans-serif;
      line-height: 1.9;
    }
    header, footer {
      padding: 22px 6%;
      border-bottom: 1px solid var(--line);
    }
    footer {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      color: var(--muted);
      font-size: 13px;
    }
    a { color: inherit; }
    .wrap {
      width: min(100% - 40px, 760px);
      margin: 0 auto;
    }
    header a {
      font-weight: 700;
      text-decoration: none;
    }
    main { padding: 55px 0 80px; }
    .meta {
      color: var(--muted);
      font-size: 13px;
    }
    .category { color: var(--accent); }
    h1 {
      font-size: clamp(30px, 6vw, 48px);
      line-height: 1.4;
    }
    .article-body { margin-top: 36px; }
    .article-body h2 {
      margin-top: 36px;
      font-size: 23px;
    }
    .back {
      display: inline-block;
      margin-top: 40px;
      color: var(--accent);
      font-weight: 700;
    }
  </style>
