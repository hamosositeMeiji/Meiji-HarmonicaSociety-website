rm .2s ease,background-color .2s ease}button:hover,.button:hover{transform:translateY(-2px)}@keyframes hm-page-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes hm-rise-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}#hamoso-accessibility{position:fixed;z-index:9999;right:16px;bottom:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100vw - 32px);padding:9px 10px;border:1px solid #c9ceb9;border-radius:16px;background:rgba(255,255,250,.96);box-shadow:0 5px 24px rgba(30,40,20,.16);font:600 14px/1.2 sans-serif;color:#26311d}#hamoso-accessibility .hm-a11y-label{font-size:12px;margin:0 2px}#hamoso-accessibility button{min-width:34px;min-height:34px;padding:6px 9px;border:1px solid #a7b18e;border-radius:9px;background:#fff;color:#26311d;font:700 14px/1.2 sans-serif;cursor:pointer}#hamoso-accessibility button:focus-visible{outline:3px solid #245fc7;outline-offset:3px}#hamoso-accessibility button[aria-pressed="true"]{background:#34452b;color:#fff;border-color:#34452b}body.hamoso-high-contrast{background:#fff!important;color:#111!important}body.hamoso-high-contrast p,body.hamoso-high-contrast li,body.hamoso-high-contrast span,body.hamoso-high-contrast h1,body.hamoso-high-contrast h2,body.hamoso-high-contrast h3,body.hamoso-high-contrast label{color:#111!important}body.hamoso-high-contrast a{color:#0645ad!important;text-decoration:underline!important}body.hamoso-high-contrast header,body.hamoso-high-contrast .site-header,body.hamoso-high-contrast .header,body.hamoso-high-contrast section,body.hamoso-high-contrast article,body.hamoso-high-contrast .card,body.hamoso-high-contrast .news-card{background-color:#fff!important;border-color:#333!important}@media(max-width:520px){#hamoso-accessibility{right:8px;bottom:8px;gap:4px;padding:7px;border-radius:12px}#hamoso-accessibility .hm-a11y-label{display:none}#hamoso-accessibility button{min-width:32px;min-height:32px;padding:5px}}@m <body>
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="../index.html">MEIJI UNIVERSITY HAMONICA SOCIETY</a>
      <a class="back-link" href="index.html">← パート一覧へ</a>
    </div>
  </header>

  <main class="wrap detail" id="main-content" tabindex="-1">
    <article>
      <p class="detail-role" id="part-role"></p>
      <h1 id="part-name"></h1>
      <div class="part-photo-grid">
        <figure class="part-photo">
          <p class="photo-label">IN PERFORMANCE / 演奏風景</p>
          <img id="part-photo" src="images/harmonica.avif" alt="ハーモニカパートの演奏風景">
          <figcaption id="part-photo-caption">ハモソの演奏風景</figcaption>
        </figure>
      </div>
      <p class="detail-intro" id="part-intro"></p>
      <section>
        <h2>どんなパート？</h2>
        <p id="part-detail"></p>
      </section>
      <section>
        <h2>ハモソの中での役割</h2>
        <p id="part-group"></p>
      </section>
    </article>
    <aside class="detail-aside">
      <p>未経験でも、どのパートが合うかわからなくても大丈夫。見学・体験で実際の音を聴いてみてください。</p>
      <a class="button" href="../index.html#join">見学・体験について</a>
    </aside>
  </main>

  <footer><div class="wrap">© 2026 MEIJI UNIVERSITY HARMONICA SOCIETY</div></footer>

  <script>
    const partData = {
      harmonica: { name: "ハーモニカ", english: "HARMONICA", image: "images/harmonica.avif", fallback: "images/HARMONICA-SAMPLE.svg", role: "01 / MELODY", intro: "ハモソの主役。主にメロディーを担当します。", detail: "穴に息を吹き込んだり吸ったりすることで音が出る楽器です。たくさんの音が重なったときの一体感も、ハーモニカならではの魅力です。", group: "フルート、クラリネットとともに、曲のメロディーを中心に担う『前パ』の一つです。" },
      flute: { name: "フルート", english: "FLUTE", image: "images/flute.avif", fallback: "images/FLUTE-SAMPLE.svg", role: "02 / MELODY", intro: "高音を担当し、きらきらと美しい音色を響かせます。", detail: "メロディーだけでなく、伴奏やコーラスも担当します。曲に合わせて、さまざまな表情をつくるパートです。", group: "ハーモニカ、クラリネットとともに、曲のメロディーを中心に担う『前パ』の一つです。" },
      clarinet: { name: "クラリネット", english: "CLARINET", image: "images/cla.avif", fallback: "images/CLARINET-SAMPLE.svg", role: "03 / MELODY", intro: "メロディーから伴奏、時にはソロまで。幅広く活躍するパートです。", detail: "いろいろな役割をこなし、深みのある音色も特徴です。曲ごとに違う役割に挑戦できる楽しさがあります。", group: "ハーモニカ、フルートとともに、曲のメロディーを中心に担う『前パ』の一つです。" },
      keyboard: { name: "キーボード", english: "KEYBOARD", image: "images/keyboard.avif", fallback: "images/KEYBOARD-SAMPLE.svg", role: "04 / HARMONY", intro: "ピアノやシンセサイザー、アコーディオンで音の広がりをつくります。", detail: "伴奏だけでなく、曲によってはソロを担当することもあります。多彩な音色でバンドを彩るパートです。", group: "ギター、ベース、パーカッションとともに、後ろから演奏を支える『コンボ』の一つです。" },
      guitar: { name: "ギター", english: "GUITAR", image: "images/guitar.avif", fallback: "images/GUITAR-SAMPLE.svg", role: "05 / HARMONY", intro: "メロディーを支え、ときには印象的なフレーズやソロも奏でます。", detail: "曲の雰囲気をつくる名脇役であり、コンボの華でもあります。さまざまな曲で活躍するパートです。", group: "キーボード、ベース、パーカッションとともに、後ろから演奏を支える『コンボ』の一つです。" },
      bass: { name: "ベース", english: "BASS", image: "images/bass.avif", fallback: "images/BASS-SAMPLE.svg", role: "06 / LOW END", intro: "低音で全体をしっかり支える、縁の下の力持ちです。", detail: "曲の土台をつくりながら、ときにはぐっと目立つフレーズも担当します。バンド全体を前に進める存在です。", group: "キーボード、ギター、パーカッションとともに、後ろから演奏を支える『コンボ』の一つです。" },
      percussion: { name: "パーカッション", english: "PERCUSSION", image: "images/par.avif", fallback: "images/PERCUSSION-SAMPLE.svg", role: "07 / RHYTHM", intro: "ドラムを中心に、演奏のリズムと勢いをつくるパートです。", detail: "グロッケンやタンバリンなど、さまざまな小物楽器でも演奏を盛り上げます。曲に合う音を選ぶ楽しさがあります。", group: "キーボード、ギター、ベースとともに、後ろから演奏を支える『コンボ』の一つです。" },
      other: { name: "その他の楽器", english: "OTHER INSTRUMENTS", image: "images/sonota.jpg", fallback: "images/PERCUSSION-SAMPLE.svg", role: "08 / COLORS", intro: "マリンバなど、曲に彩りを加える楽器も活躍します。", detail: "ハモソでは編成や曲に応じてさまざまな楽器を取り入れています。音色の違いが、演奏に豊かな表情を加えます。", group: "曲に合わせて必要な音色を加え、バンド全体の表現の幅を広げます。" }
    };

    const requestedPart = new URLSearchParams(window.location.search).get("part");
    const part = partData[requestedPart] || partData.harmonica;
    document.title = part.name + "｜パート紹介｜明治大学ハーモニカソサエティー";
    document.getElementById("part-role").textContent = part.role + " / " + part.english;
    document.getElementById("part-name").textContent = part.name;
    const photo = document.getElementById("part-photo");
    photo.src = part.image;
    photo.alt = part.name + "パートの演奏風景";
    photo.addEventListener("error", () => {
      if (photo.dataset.fallbackApplied !== "true") {
        photo.dataset.fallbackApplied = "true";
        photo.src = part.fallback;
      }
    });
    document.getElementById("part-photo-caption").textContent = part.name + "の演奏風景";
    document.getElementById("part-intro").textContent = part.intro;
    document.getElementById("part-detail").textContent = part.detail;
    document.getElementById("part-group").textContent = part.group;
  </script>

</body>
