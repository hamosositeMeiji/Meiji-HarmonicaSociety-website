<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="明治大学ハーモニカソサエティーのパート紹介。">
  <title>パート紹介｜明治大学ハーモニカソサエティー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="parts.css">

  <style id="hamoso-social-float-style">
    .hamoso-social-float{position:fixed;right:20px;bottom:22px;z-index:9999;display:flex;flex-direction:row;gap:10px}
    .hamoso-social-float a{width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#242820;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:transform .2s ease,background .2s ease}
    .hamoso-social-float a:hover{transform:translateY(-3px);background:#56633b}
    .hamoso-social-float a:focus-visible{outline:3px solid #a6b86a;outline-offset:3px}
    .hamoso-social-float svg{width:24px;height:24px;display:block;fill:currentColor}
    .hamoso-social-float .instagram svg{fill:none;stroke:currentColor;stroke-width:1.9}
    @media(max-width:600px){.hamoso-social-float{right:12px;bottom:14px;gap:8px}.hamoso-social-float a{width:44px;height:44px}.hamoso-social-float svg{width:20px;height:20px}}
  </style>
<style id="hamoso-motion-design">html{scroll-behavior:smooth}body{background-color:#f5f4ec;background-image:radial-gradient(circle,rgba(101,120,61,.22) 1.25px,transparent 1.6px),radial-gradient(circle,rgba(166,184,106,.16) 1px,transparent 1.4px);background-size:18px 18px,54px 54px;background-position:0 0,9px 9px;background-attachment:fixed}body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(135deg,rgba(255,255,255,.28),transparent 45%,rgba(166,184,106,.08))}header,.site-header,.header{backdrop-filter:blur(10px)}main{animation:hm-page-in .7s cubic-bezier(.2,.7,.2,1) both}main section,main article,.year-archive,.news-card,.article-card,.info-card,.card,.detail-aside,.form-panel{animation:hm-rise-in .65s cubic-bezier(.2,.7,.2,1) both}main section:nth-of-type(2),main article:nth-of-type(2),.card:nth-child(2),.news-card:nth-child(2),.article-card:nth-child(2){animation-delay:.07s}main section:nth-of-type(3),.card:nth-child(3),.news-card:nth-child(3),.article-card:nth-child(3){animation-delay:.13s}main section:nth-of-type(4),.card:nth-child(4),.news-card:nth-child(4),.article-card:nth-child(4){animation-delay:.19s}.card,.news-card,.article-card,.year-archive,.info-card,.button,.social-links a{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease,background-color .25s ease}.card:hover,.news-card:hover,.article-card:hover,.year-archive:hover{transform:translateY(-5px);box-shadow:0 12px 30px rgba(36,40,32,.10)}button,.button{transition:transform .2s ease,background-color .2s ease}button:hover,.button:hover{transform:translateY(-2px)}img{transition:filter .35s ease}a:focus-visible,button:focus-visible{outline:2px solid #8b9f40;outline-offset:4px}@keyframes hm-page-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes hm-rise-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}</style>
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="../index.html">MEIJI UNIVERSITY HAMONICA SOCIETY</a>
      <a class="back-link" href="index.html">← パート一覧へ</a>
    </div>
  </header>

  <main class="wrap detail" id="main-content" tabindex="-1">
    <article>
      <p class="detail-role" id="part-role"></p>
      <h1 id="part-name"></h1>
      <div class="part-photo-grid">
        <figure class="part-photo">
          <p class="photo-label">IN PERFORMANCE / 演奏風景</p>
          <img id="part-photo" src="images/harmonica.avif" alt="ハーモニカパートの演奏風景">
          <figcaption id="part-photo-caption">ハモソの演奏風景</figcaption>
        </figure>
      </div>
      <p class="detail-intro" id="part-intro"></p>
      <section>
        <h2>どんなパート？</h2>
        <p id="part-detail"></p>
      </section>
      <section>
        <h2>ハモソの中での役割</h2>
        <p id="part-group"></p>
      </section>
    </article>
    <aside class="detail-aside">
      <p>未経験でも、どのパートが合うかわからなくても大丈夫。見学・体験で実際の音を聴いてみてください。</p>
      <a class="button" href="../index.html#join">見学・体験について</a>
    </aside>
  </main>

  <footer><div class="wrap">© 2026 MEIJI UNIVERSITY HARMONICA SOCIETY</div></footer>

  <script>
    const partData = {
      harmonica: { name: "ハーモニカ", english: "HARMONICA", image: "images/harmonica.avif", fallback: "images/HARMONICA-SAMPLE.svg", role: "01 / MELODY", intro: "ハモソの主役。主にメロディーを担当します。", detail: "穴に息を吹き込んだり吸ったりすることで音が出る楽器です。たくさんの音が重なったときの一体感も、ハーモニカならではの魅力です。", group: "フルート、クラリネットとともに、曲のメロディーを中心に担う『前パ』の一つです。" },
      flute: { name: "フルート", english: "FLUTE", image: "images/flute.avif", fallback: "images/FLUTE-SAMPLE.svg", role: "02 / MELODY", intro: "高音を担当し、きらきらと美しい音色を響かせます。", detail: "メロディーだけでなく、伴奏やコーラスも担当します。曲に合わせて、さまざまな表情をつくるパートです。", group: "ハーモニカ、クラリネットとともに、曲のメロディーを中心に担う『前パ』の一つです。" },
      clarinet: { name: "クラリネット", english: "CLARINET", image: "images/cla.avif", fallback: "images/CLARINET-SAMPLE.svg", role: "03 / MELODY", intro: "メロディーから伴奏、時にはソロまで。幅広く活躍するパートです。", detail: "いろいろな役割をこなし、深みのある音色も特徴です。曲ごとに違う役割に挑戦できる楽しさがあります。", group: "ハーモニカ、フルートとともに、曲のメロディーを中心に担う『前パ』の一つです。" },
      keyboard: { name: "キーボード", english: "KEYBOARD", image: "images/keyboard.avif", fallback: "images/KEYBOARD-SAMPLE.svg", role: "04 / HARMONY", intro: "ピアノやシンセサイザー、アコーディオンで音の広がりをつくります。", detail: "伴奏だけでなく、曲によってはソロを担当することもあります。多彩な音色でバンドを彩るパートです。", group: "ギター、ベース、パーカッションとともに、後ろから演奏を支える『コンボ』の一つです。" },
      guitar: { name: "ギター", english: "GUITAR", image: "images/guitar.avif", fallback: "images/GUITAR-SAMPLE.svg", role: "05 / HARMONY", intro: "メロディーを支え、ときには印象的なフレーズやソロも奏でます。", detail: "曲の雰囲気をつくる名脇役であり、コンボの華でもあります。さまざまな曲で活躍するパートです。", group: "キーボード、ベース、パーカッションとともに、後ろから演奏を支える『コンボ』の一つです。" },
      bass: { name: "ベース", english: "BASS", image: "images/bass.avif", fallback: "images/BASS-SAMPLE.svg", role: "06 / LOW END", intro: "低音で全体をしっかり支える、縁の下の力持ちです。", detail: "曲の土台をつくりながら、ときにはぐっと目立つフレーズも担当します。バンド全体を前に進める存在です。", group: "キーボード、ギター、パーカッションとともに、後ろから演奏を支える『コンボ』の一つです。" },
      percussion: { name: "パーカッション", english: "PERCUSSION", image: "images/par.avif", fallback: "images/PERCUSSION-SAMPLE.svg", role: "07 / RHYTHM", intro: "ドラムを中心に、演奏のリズムと勢いをつくるパートです。", detail: "グロッケンやタンバリンなど、さまざまな小物楽器でも演奏を盛り上げます。曲に合う音を選ぶ楽しさがあります。", group: "キーボード、ギター、ベースとともに、後ろから演奏を支える『コンボ』の一つです。" },
      other: { name: "その他の楽器", english: "OTHER INSTRUMENTS", image: "images/sonota.jpg", fallback: "images/PERCUSSION-SAMPLE.svg", role: "08 / COLORS", intro: "マリンバなど、曲に彩りを加える楽器も活躍します。", detail: "ハモソでは編成や曲に応じてさまざまな楽器を取り入れています。音色の違いが、演奏に豊かな表情を加えます。", group: "曲に合わせて必要な音色を加え、バンド全体の表現の幅を広げます。" }
    };

    const requestedPart = new URLSearchParams(window.location.search).get("part");
    const part = partData[requestedPart] || partData.harmonica;
    document.title = part.name + "｜パート紹介｜明治大学ハーモニカソサエティー";
    document.getElementById("part-role").textContent = part.role + " / " + part.english;
    document.getElementById("part-name").textContent = part.name;
    const photo = document.getElementById("part-photo");
    photo.src = part.image;
    photo.alt = part.name + "パートの演奏風景";
    photo.addEventListener("error", () => {
      if (photo.dataset.fallbackApplied !== "true") {
        photo.dataset.fallbackApplied = "true";
        photo.src = part.fallback;
      }
    });
    document.getElementById("part-photo-caption").textContent = part.name + "の演奏風景";
    document.getElementById("part-intro").textContent = part.intro;
    document.getElementById("part-detail").textContent = part.detail;
    document.getElementById("part-group").textContent = part.group;
  </script>
