<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">パートのメンバー写真サンプル</title>
  <desc id="desc">掲載許諾済みの写真に差し替えるための仮画像です。</desc>
  <rect width="1200" height="900" fill="#eeefe7"/>
  <rect x="44" y="44" width="1112" height="812" rx="12" fill="none" stroke="#a6b86a" stroke-width="3" stroke-dasharray="12 12"/>
  <g fill="#65783d" text-anchor="middle" font-family="Arial, sans-serif">
    <text x="600" y="370" font-size="36" font-weight="700" letter-spacing="8">メンバー写真</text>
    <text x="600" y="455" font-size="58" font-weight="700">GUITAR</text>
    <text x="600" y="530" font-size="38">ギター パート</text>
    <text x="600" y="625" font-size="26">掲載許諾済みの写真に差し替えてください</text>
  </g>
</svg>